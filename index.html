function PendingDocRow({ member, members, refreshAll }) {
  const [busy, setBusy] = useState(false);
  const decide = async (status) => {
    setBusy(true);
    const all = await loadShared("members", []);
    const idx = all.findIndex(m => m.name === member.name && m.joinedAt === member.joinedAt);
    if (idx > -1) { all[idx].documentStatus = status; await saveShared("members", all); }
    await refreshAll();
    setBusy(false);
  };
  return (
    <div style={{ background: COLORS.paper, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 10, marginBottom: 8, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8 }}>
      <div>
        <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5 }}>{member.name}</div>
        <div style={{ fontFamily: "Inter", fontSize: 10.5, color: "#8A8776" }}>
          {PROFILE_TYPE_LABELS[member.profileType] || member.profileType} · Belge No: {member.documentRef || "belirtilmemiş"} · {member.phone || "telefon yok"}
        </div>
      </div>
      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
        <button disabled={busy} onClick={() => decide("onaylandi")} style={{ ...btnGhost, borderColor: COLORS.pine, color: COLORS.pineDeep }}><Check size={12} style={{ marginRight: 3 }} />Onayla</button>
        <button disabled={busy} onClick={() => decide("reddedildi")} style={{ ...btnGhost, borderColor: COLORS.red, color: COLORS.red }}><X size={12} style={{ marginRight: 3 }} />Reddet</button>
      </div>
    </div>
  );
}

function AdminPanel({ listings, requests, offers, members, refreshAll }) {
  const [role, setRole] = useState("super");
  const active = ROLES[role];
  const subscribedCount = members.filter(m => m.subscribed).length;
  const revenue = subscribedCount * 1000;
  const pendingDocs = members.filter(m => m.documentStatus === "beklemede");

  const sections = {
    finans: { title: "Finansal Yönetim", icon: DollarSign, body: `Aktif abone: ${subscribedCount} · Aylık gelir (gerçek veriye dayalı): ${TL(revenue)}` },
    fiyat: { title: "Fiyatlandırma Yönetimi", icon: Settings, body: "Aylık abonelik: " + TL(1000) },
    yonetici: { title: "Sistem & Yönetici Yönetimi", icon: Users, body: `Toplam kayıtlı üye: ${members.length}` },
    ilan: { title: "İlan Moderasyonu", icon: Flag, body: `Yayında ${listings.length} ilan` },
    kullanici: { title: "Kullanıcı Yönetimi", icon: Ban, body: `${members.length} kullanıcı, 0 askıya alınmış` },
    belge: { title: "Belge Onayları", icon: ShieldCheck, body: `${pendingDocs.length} onay bekleyen belge` },
    destek: { title: "Destek Talepleri", icon: LifeBuoy, body: `${requests.length} açık alım talebi, ${offers.length} toplam teklif` },
  };

  return (
    <div style={{ width: 620, background: COLORS.white, borderRadius: 18, border: `1px solid ${COLORS.line}`, overflow: "hidden", boxShadow: "0 20px 50px rgba(0,0,0,0.12)" }}>
      <div style={{ background: COLORS.pineDeep, padding: "16px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 17, color: COLORS.white }}>Yönetim Paneli</div>
        <div style={{ display: "flex", gap: 6 }}>
          {Object.entries(ROLES).map(([k, r]) => (
            <button key={k} onClick={() => setRole(k)} style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 11.5, padding: "7px 11px", borderRadius: 8, border: "none", cursor: "pointer", background: role === k ? COLORS.ochre : "rgba(255,255,255,0.12)", color: role === k ? "#3A2C0E" : "#D8E6DC" }}>{r.label}</button>
          ))}
        </div>
      </div>
      <div style={{ padding: 18 }}>
        <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776", marginBottom: 14 }}>Rakamlar bu artifact'ı kullanan tüm kullanıcıların gerçek verilerinden hesaplanır.</div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {Object.entries(sections).map(([key, s]) => {
            const unlocked = active.sections.includes(key);
            const Icon = s.icon;
            return (
              <div key={key} style={{ border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 13, background: unlocked ? COLORS.paper : "#F7F6F2", opacity: unlocked ? 1 : 0.55 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 6 }}>
                  {unlocked ? <Icon size={15} color={COLORS.pineDeep} /> : <Lock size={13} color="#A8A594" />}
                  <span style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, color: unlocked ? COLORS.ink : "#8A8776" }}>{s.title}</span>
                </div>
                <div style={{ fontFamily: unlocked ? "IBM Plex Mono" : "Inter", fontSize: 11, color: unlocked ? "#5A574C" : "#A8A594" }}>{unlocked ? s.body : "Bu role erişim yok"}</div>
              </div>
            );
          })}
        </div>

        {active.sections.includes("belge") && (
          <div style={{ marginTop: 16 }}>
            <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13, marginBottom: 8 }}>Onay Bekleyen Belgeler ({pendingDocs.length})</div>
            {pendingDocs.length === 0 ? (
              <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776" }}>Bekleyen belge yok.</div>
            ) : (
              pendingDocs.map(m => <PendingDocRow key={m.name + m.joinedAt} member={m} members={members} refreshAll={refreshAll} />)
            )}
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BenimMeram />);

</script>

</body>
</html>
