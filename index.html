<script>
  function showError(msg) {
    var box = document.getElementById("error-box");
    box.style.display = "block";
    box.textContent = "HATA (bu metni Claude'a gönderin):\n\n" + msg;
  }
  window.addEventListener("error", function (e) {
    showError((e.message || "Bilinmeyen hata") + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    showError("Promise hatası: " + (e.reason && e.reason.message ? e.reason.message : JSON.stringify(e.reason)));
  });
  setTimeout(function () {
    var root = document.getElementById("root");
    if (root && root.textContent.indexOf("Yükleniyor") !== -1) {
      showError("Uygulama 8 saniye içinde yüklenemedi. İnternet bağlantısını ve aşağıdaki script'lerin engellenmediğini kontrol edin (reklam engelleyici / VPN kapatmayı deneyin).");
    }
  }, 8000);
</script>

<!-- Bu blok, uygulamanın Claude'a özel window.storage API'sini taklit eder.
     API_BASE_URL boşsa (henüz sunucu kurulmadıysa) veriler sadece bu tarayıcıda
     (localStorage) tutulur. Senkronizasyon sunucusunu (sync-server) kurup
     adresini aşağıya yazdığınızda, veriler o sunucu üzerinden TÜM cihazlar
     arasında paylaşılır. Bu script, uygulama kodu çalışmadan ÖNCE çalışır. -->
<script>
(function () {
  // ---- BURAYI DÜZENLEYİN ----
  // sync-server'ı (Render vb.) yayına aldıktan sonra adresini buraya yazın.
  // Örnek: "https://benim-meram-sync.onrender.com"
  // Bu dosya artık sync-server tarafından servis edildiği için (aynı adresten),
  // boş bırakmak otomatik olarak "bu sunucu" anlamına gelir — elle adres yazmaya gerek yok.
  var API_BASE_URL = "";
  // ----------------------------

  function ns(shared) { return shared ? "bm_shared_" : "bm_personal_"; }

  function getDeviceId() {
    var id = localStorage.getItem("bm_device_id");
    if (!id) {
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + "-" + Math.random().toString(36).slice(2));
      localStorage.setItem("bm_device_id", id);
    }
    return id;
  }

  // ---- Yerel (tek cihaz) depolama — sunucu adresi girilmemişse veya sunucuya ulaşılamazsa kullanılır ----
  var localBackend = {
    get: function (key, shared) {
      try {
        var raw = localStorage.getItem(ns(shared) + key);
        return Promise.resolve(raw === null ? null : { key: key, value: raw, shared: !!shared });
      } catch (e) { return Promise.reject(e); }
    },
    set: function (key, value, shared) {
      try {
        localStorage.setItem(ns(shared) + key, value);
        return Promise.resolve({ key: key, value: value, shared: !!shared });
      } catch (e) { return Promise.reject(e); }
    },
    delete: function (key, shared) {
      try {
        localStorage.removeItem(ns(shared) + key);
        return Promise.resolve({ key: key, deleted: true, shared: !!shared });
      } catch (e) { return Promise.reject(e); }
    },
    list: function () { return Promise.resolve({ keys: [] }); }
  };

  // ---- Sunucu tabanlı (çok cihazlı, paylaşımlı) depolama ----
  var remoteBackend = {
    get: function (key, shared) {
      return fetch(API_BASE_URL + "/kv/get", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, shared: !!shared, owner: getDeviceId() })
      })
        .then(function (r) { if (!r.ok) throw new Error("sunucu hatası: " + r.status); return r.json(); })
        .then(function (data) {
          return data.value == null ? null : { key: key, value: data.value, shared: !!shared };
        })
        .catch(function (e) {
          console.warn("Senkronizasyon sunucusuna ulaşılamadı, bu cihazda yerel depolamaya geçiliyor:", e);
          return localBackend.get(key, shared);
        });
    },
    set: function (key, value, shared) {
      return fetch(API_BASE_URL + "/kv/set", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key: key, shared: !!shared, owner: getDeviceId(), value: value })
      })
        .then(function (r) { if (!r.ok) throw new Error("sunucu hatası: " + r.status); return r.json(); })
        .then(function () { return { key: key, value: value, shared: !!shared }; })
        .catch(function (e) {
          console.warn("Senkronizasyon sunucusuna ulaşılamadı, bu cihazda yerel depolamaya geçiliyor:", e);
          return localBackend.set(key, value, shared);
        });
    },
    delete: function (key, shared) {
      // basit sürümde silme, boş değer yazılarak simüle edilir
      return remoteBackend.set(key, "", shared).then(function () { return { key: key, deleted: true, shared: !!shared }; });
    },
    list: function () { return Promise.resolve({ keys: [] }); }
  };

  // Bu sürüm her zaman sunucu (remote) depolamayı kullanır — aynı adresten servis edildiği için.
  window.storage = remoteBackend;
})();
</script>

function sellerRating(reviews, sellerName) {
  const mine = reviews.filter(r => r.sellerName === sellerName);
  if (mine.length === 0) return { avg: 0, count: 0 };
  const avg = mine.reduce((sum, r) => sum + r.stars, 0) / mine.length;
  return { avg: Math.round(avg * 10) / 10, count: mine.length };
}

// ---------- STORAGE HELPERS (window.storage başarısız olursa bellek içi yedeğe düşer) ----------
const memoryStore = { shared: {}, personal: {} };
let storageIsHealthy = true; // ilk arızadan sonra tekrar tekrar denemekle uğraşmamak için

async function rawGet(key, shared) {
  if (!window.storage || !storageIsHealthy) {
    const store = shared ? memoryStore.shared : memoryStore.personal;
    return key in store ? { value: store[key] } : null;
  }
  try {
    return await window.storage.get(key, shared);
  } catch (e) {
    console.warn("window.storage.get başarısız, bellek yedeğine geçiliyor:", e);
    storageIsHealthy = false;
    const store = shared ? memoryStore.shared : memoryStore.personal;
    return key in store ? { value: store[key] } : null;
  }
}

async function rawSet(key, value, shared) {
  const store = shared ? memoryStore.shared : memoryStore.personal;
  if (!window.storage || !storageIsHealthy) {
    store[key] = value;
    return { ok: true, fallback: true };
  }
  try {
    const result = await window.storage.set(key, value, shared);
    if (!result) throw new Error("window.storage.set null/boş yanıt döndürdü.");
    return { ok: true };
  } catch (e) {
    console.warn("window.storage.set başarısız, bellek yedeğine geçiliyor:", e);
    storageIsHealthy = false;
    store[key] = value; // yine de kullanıcı kaybetmesin diye belleğe yaz
    return { ok: true, fallback: true };
  }
}

async function loadShared(key, fallback) {
  try { const r = await rawGet(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch (e) { console.error("loadShared hata:", key, e); return fallback; }
}
async function saveShared(key, value) {
  return rawSet(key, JSON.stringify(value), true);
}
async function loadPersonal(key, fallback) {
  try { const r = await rawGet(key, false); return r ? JSON.parse(r.value) : fallback; }
  catch (e) { console.error("loadPersonal hata:", key, e); return fallback; }
}
async function savePersonal(key, value) {
  return rawSet(key, JSON.stringify(value), false);
}

  const [password, setPassword] = useState("");
  const [emailName, setEmailName] = useState("");
  const [err, setErr] = useState("");
  const [saving, setSaving] = useState(false);

  const sendCode = () => { if (phone.length < 10) { setErr("Geçerli bir telefon numarası girin."); return; } setErr(""); setStep("code"); };
  const verifyCode = () => { if (code !== "1234") { setErr("Kod hatalı. (Simülasyon kodu: 1234)"); return; } setErr(""); setStep("profile"); };
  const goToDoc = () => { if (!name.trim()) { setErr("Ad soyad girin."); return; } setErr(""); setStep("belge"); };

  const registerMember = async (me, extra) => {
    const saveMeResult = await savePersonal("me", me);
    if (!saveMeResult.ok) return { ok: false, error: "Kayıt başarısız: " + saveMeResult.error };
    const members = await loadShared("members", []);
    const saveMembersResult = await saveShared("members", [...members, {
      name: me.name, profileType: me.profileType, subscribed: false, joinedAt: me.joinedAt, phone: me.phone, ...extra,
    }]);
    if (!saveMembersResult.ok) return { ok: false, error: "Üye listesi kaydedilemedi: " + saveMembersResult.error };
    return { ok: true };
  };

  const finish = async () => {
    if (!docRef.trim()) { setErr("Belge/vergi numarası girin."); return; }
    setSaving(true);
    const me = { name: name.trim(), phone, email: null, authMethod: "phone", profileType, subscribed: false, joinedAt: Date.now(), documentStatus: "beklemede" };
    const result = await registerMember(me, { documentStatus: "beklemede", documentRef: docRef.trim() });
    setSaving(false);
    if (!result.ok) { setErr(result.error); return; }
    onDone(me);
  };

  const finishEmail = async () => {
    if (!emailName.trim()) { setErr("Ad soyad girin."); return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { setErr("Geçerli bir e-posta adresi girin."); return; }
    if (emailPhone.length < 10) { setErr("Geçerli bir telefon numarası girin."); return; }
    if (password.length < 4) { setErr("Şifre en az 4 karakter olmalı."); return; }
    setSaving(true);
    const me = { name: emailName.trim(), phone: emailPhone, email, authMethod: "email", profileType: "alici", subscribed: false, joinedAt: Date.now() };
    const result = await registerMember(me, {});
    setSaving(false);
    if (!result.ok) { setErr(result.error); return; }
    onDone(me);
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 26px" }}>
      <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 22, color: COLORS.pineDeep, marginBottom: 4, display: "flex", alignItems: "center", gap: 9 }}><Logo size={30} />Benim Meram</div>

      {step === "choice" && (
        <>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776", marginBottom: 22 }}>Devam etmek için bir kayıt yöntemi seçin.</div>
          <button onClick={() => { setErr(""); setStep("phone"); }} style={{ ...btnPrimary, marginBottom: 10, textAlign: "left" }}>
            Telefon ile Kayıt Ol<br /><span style={{ fontWeight: 400, fontSize: 11, opacity: 0.85 }}>Hayvan satacak veya alıp satacaksanız</span>
          </button>
          <button onClick={() => { setErr(""); setStep("email"); }} style={{ ...btnPrimary, background: COLORS.white, color: COLORS.pineDeep, border: `1.5px solid ${COLORS.pine}`, textAlign: "left" }}>
            Sadece Alıcıyım — E-posta ile Kayıt Ol<br /><span style={{ fontWeight: 400, fontSize: 11, opacity: 0.75 }}>Sadece hayvan aramak/satın almak istiyorsanız</span>
          </button>
        </>
      )}

      {step === "phone" && (
        <>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776", marginBottom: 16 }}>Devam etmek için telefon numaranızı doğrulayın.</div>
          <FormField label="Telefon Numarası" value={phone} onChange={setPhone} placeholder="05XX XXX XX XX" />
          {err && <div style={{ color: COLORS.red, fontFamily: "Inter", fontSize: 11.5, marginTop: 6 }}>{err}</div>}
          <button onClick={sendCode} style={{ ...btnPrimary, marginTop: 14 }}>SMS Kodu Gönder</button>
          <button onClick={() => { setErr(""); setStep("choice"); }} style={{ background: "none", border: "none", color: "#8A8776", fontFamily: "Inter", fontSize: 11.5, marginTop: 10, cursor: "pointer" }}>← Geri</button>
        </>
      )}
      {step === "code" && (
        <>
          <div style={{ fontFamily: "Inter", fontSize: 11.5, color: COLORS.ochre, marginBottom: 8, background: COLORS.ochreSoft, padding: 8, borderRadius: 8 }}>
            SİMÜLASYON: gerçek SMS gönderilmedi. Test kodu: <b>1234</b>
          </div>
          <FormField label="Doğrulama Kodu" value={code} onChange={setCode} placeholder="1234" />
          {err && <div style={{ color: COLORS.red, fontFamily: "Inter", fontSize: 11.5, marginTop: 6 }}>{err}</div>}
          <button onClick={verifyCode} style={{ ...btnPrimary, marginTop: 14 }}>Doğrula</button>
        </>
      )}
      {step === "profile" && (
        <>
          <FormField label="Ad Soyad" value={name} onChange={setName} placeholder="Adınız Soyadınız" />
          <div style={{ marginTop: 10 }}>
            <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Profil Tipi</label>
            <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
              {[["bireysel", "Bireysel Yetiştirici"], ["ciftlik", "Çiftlik / Ticari"]].map(([k, l]) => (
                <button key={k} onClick={() => setProfileType(k)} style={{ flex: 1, padding: "9px", borderRadius: 9, border: "none", cursor: "pointer", fontFamily: "Inter", fontWeight: 600, fontSize: 11.5, background: profileType === k ? COLORS.pineDeep : COLORS.white, color: profileType === k ? COLORS.white : "#5A574C", border: `1px solid ${COLORS.line}` }}>{l}</button>
              ))}
            </div>
          </div>
          {err && <div style={{ color: COLORS.red, fontFamily: "Inter", fontSize: 11.5, marginTop: 6 }}>{err}</div>}
          <button onClick={goToDoc} style={{ ...btnPrimary, marginTop: 14 }}>Devam Et</button>
        </>
      )}

      {step === "belge" && (
        <>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776", marginBottom: 10 }}>
            Satış yapabilmeniz için kimlik/işletme belgenizin yönetici tarafından onaylanması gerekir.
          </div>
          <FormField label="Belge / Vergi Numarası" value={docRef} onChange={setDocRef} placeholder="TC Kimlik No veya Vergi No" />
          <div style={{ border: `1.5px dashed ${COLORS.line}`, borderRadius: 12, padding: 16, textAlign: "center", fontFamily: "Inter", fontSize: 11, color: "#8A8776", marginTop: 10 }}>
            Belge fotoğrafı yükleme (bu prototipte pasif)
          </div>
          <div style={{ fontFamily: "Inter", fontSize: 10, color: COLORS.ochre, marginTop: 8 }}>
            Belgeniz onaylanana kadar hesabınız "Onay Bekliyor" durumunda olur ve ilan veremezsiniz. Onay yönetim panelinden Moderatör veya Süper Admin tarafından verilir.
          </div>
          {err && <div style={{ color: COLORS.red, fontFamily: "Inter", fontSize: 11.5, marginTop: 6 }}>{err}</div>}
          <button onClick={finish} disabled={saving} style={{ ...btnPrimary, marginTop: 14 }}>{saving ? "Kaydediliyor..." : "Belgeyi Gönder ve Hesabı Oluştur"}</button>
          <button onClick={() => { setErr(""); setStep("profile"); }} style={{ background: "none", border: "none", color: "#8A8776", fontFamily: "Inter", fontSize: 11.5, marginTop: 10, cursor: "pointer" }}>← Geri</button>
        </>
      )}

      {step === "email" && (
        <>
          <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776", marginBottom: 16 }}>Sadece alım yapmak için hızlı kayıt.</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <FormField label="Ad Soyad" value={emailName} onChange={setEmailName} placeholder="Adınız Soyadınız" />
            <FormField label="Telefon Numarası" value={emailPhone} onChange={setEmailPhone} placeholder="05XX XXX XX XX" />
            <FormField label="E-posta" value={email} onChange={setEmail} placeholder="ornek@eposta.com" type="email" />
            <FormField label="Şifre" value={password} onChange={setPassword} placeholder="En az 4 karakter" type="password" />
          </div>
          <div style={{ fontFamily: "Inter", fontSize: 10, color: COLORS.ochre, marginTop: 8 }}>
            ⚠ SİMÜLASYON: bu şifre yalnızca bu cihazda saklanır, gerçek bir kimlik doğrulama sunucusuna gönderilmez.
          </div>
          {err && <div style={{ color: COLORS.red, fontFamily: "Inter", fontSize: 11.5, marginTop: 6 }}>{err}</div>}
          <button onClick={finishEmail} disabled={saving} style={{ ...btnPrimary, marginTop: 14 }}>{saving ? "Kaydediliyor..." : "Hesabı Oluştur"}</button>
          <button onClick={() => { setErr(""); setStep("choice"); }} style={{ background: "none", border: "none", color: "#8A8776", fontFamily: "Inter", fontSize: 11.5, marginTop: 10, cursor: "pointer" }}>← Geri</button>
        </>
      )}
    </div>
  );
}

// ---------- LISTING CARD ----------
function ListingCard({ item, reviews, favorites, toggleFavorite, onOpen }) {
  const rating = sellerRating(reviews, item.sellerName);
  const isFav = favorites.includes(item.id);
  return (
    <button onClick={() => onOpen(item)} style={{ textAlign: "left", background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 16, overflow: "hidden", cursor: "pointer", padding: 0, display: "flex", flexDirection: "column" }}>
      <div style={{ background: "#DFF0E4", height: 88, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 38, position: "relative" }}>
        {EMOJI[item.subCategory] || "🐾"}
        <span
          onClick={(e) => { e.stopPropagation(); toggleFavorite(item.id); }}
          style={{ position: "absolute", top: 7, right: 7, width: 24, height: 24, borderRadius: "50%", background: "rgba(255,255,255,0.85)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}
        >
          <Heart size={13} fill={isFav ? COLORS.red : "none"} color={isFav ? COLORS.red : COLORS.pineDeep} />
        </span>
      </div>
      <div style={{ padding: "10px 11px 12px" }}>
        <div style={{ fontFamily: "Fraunces", fontWeight: 600, fontSize: 14.5, color: COLORS.ink }}>{item.breed} {item.subCategory}</div>
        <div style={{ fontFamily: "Inter", fontSize: 11, color: "#7A7768", margin: "2px 0 6px" }}>{item.age} · {item.gender}{item.weight ? ` · ${item.weight} kg` : ""}</div>
        <div style={{ fontFamily: "IBM Plex Mono", fontWeight: 600, fontSize: 14.5, color: COLORS.pineDeep, marginBottom: 6 }}>{TL(item.price)}</div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <span style={{ fontFamily: "Inter", fontSize: 10, color: "#8A8776" }}>{item.sellerName}</span>
          {rating.count > 0 && (
            <span style={{ display: "flex", alignItems: "center", gap: 2 }}>
              <Star size={10} fill={COLORS.ochre} color={COLORS.ochre} />
              <span style={{ fontFamily: "IBM Plex Mono", fontSize: 10, color: "#5A574C" }}>{rating.avg}</span>
            </span>
          )}
        </div>
        <Badge tone={item.profileType === "ciftlik" ? "pine" : "gray"}>{item.profileType === "ciftlik" ? "Çiftlik" : "Bireysel"}</Badge>
      </div>
    </button>
  );
}

// ---------- MAIN APP ----------
function BenimMeram() {
  const [loading, setLoading] = useState(true);
  const [me, setMe] = useState(null);
  const [listings, setListings] = useState([]);
  const [requests, setRequests] = useState([]);
  const [offers, setOffers] = useState([]);
  const [members, setMembers] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [messages, setMessages] = useState([]);
  const [favorites, setFavorites] = useState([]);

  const [screen, setScreen] = useState("home");
  const [tab, setTab] = useState("buyukbas");
  const [subTab, setSubTab] = useState("tumu");
  const [breedTab, setBreedTab] = useState("tumu");
  const [drawer, setDrawer] = useState(false);
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("app"); // app | admin

  const refreshAll = useCallback(async () => {
    const [l, r, o, m, rv, msg] = await Promise.all([loadShared("listings", []), loadShared("requests", []), loadShared("offers", []), loadShared("members", []), loadShared("reviews", []), loadShared("messages", [])]);
    setListings(l); setRequests(r); setOffers(o); setMembers(m); setReviews(rv); setMessages(msg);
  }, []);

  const toggleFavorite = useCallback(async (listingId) => {
    setFavorites(prev => {
      const next = prev.includes(listingId) ? prev.filter(id => id !== listingId) : [...prev, listingId];
      savePersonal("favorites", next);
      return next;
    });
  }, []);

  useEffect(() => {
    (async () => {
      const savedMe = await loadPersonal("me", null);
      const savedFavorites = await loadPersonal("favorites", []);
      await refreshAll();
      setMe(savedMe);
      setFavorites(savedFavorites);
      setLoading(false);
    })();
  }, [refreshAll]);

  if (loading) {
    return <div style={{ minHeight: "100vh", background: COLORS.paper, display: "flex", alignItems: "center", justifyContent: "center" }}><style>{fontImport}</style><Loading /></div>;
  }

  return (
    <div style={{ minHeight: "100vh", background: `linear-gradient(180deg, ${COLORS.paper}, #ECE9DF)`, display: "flex", flexDirection: "column", alignItems: "center", padding: "30px 16px 60px", fontFamily: "Inter" }}>
      <style>{fontImport}</style>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
        <Logo size={26} />
        <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 15, color: COLORS.pineDeep }}>BENİM MERAM</div>
      </div>
      <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776", marginBottom: 6, textAlign: "center", maxWidth: 440 }}>
        Gerçek verilerle çalışan pazar yeri. Bu uygulamayı kullanan herkes aynı ilanları ve talepleri görür.
      </div>
      <div style={{ fontFamily: "Inter", fontSize: 10.5, color: COLORS.ochre, marginBottom: 18 }}>⚠ SMS ve ödeme adımları simülasyondur — gerçek sağlayıcı bağlanmadı.</div>

      <div style={{ display: "flex", gap: 8, marginBottom: 24, background: COLORS.white, padding: 4, borderRadius: 12, border: `1px solid ${COLORS.line}` }}>
        <button onClick={() => setView("app")} style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", background: view === "app" ? COLORS.pineDeep : "transparent", color: view === "app" ? COLORS.white : "#5A574C" }}>Uygulama</button>
        <button onClick={() => setView("admin")} style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", background: view === "admin" ? COLORS.pineDeep : "transparent", color: view === "admin" ? COLORS.white : "#5A574C" }}>Yönetim Paneli</button>
      </div>

      {view === "admin" ? (
        <AdminPanel listings={listings} requests={requests} offers={offers} members={members} refreshAll={refreshAll} />
      ) : (
        <div style={{ width: 360, height: 700, background: COLORS.paper, borderRadius: 34, border: `10px solid ${COLORS.ink}`, overflow: "hidden", position: "relative", boxShadow: "0 30px 60px rgba(0,0,0,0.35)", display: "flex", flexDirection: "column" }}>
          <style>{`@keyframes pulseDot {0%{transform:scale(1);opacity:.7}70%{transform:scale(2.6);opacity:0}100%{opacity:0}}`}</style>
          {!me ? (
            <Onboarding onDone={(m) => setMe(m)} />
          ) : (
            <AppShell
              me={me} setMe={setMe}
              listings={listings} requests={requests} offers={offers} reviews={reviews} messages={messages} members={members}
              favorites={favorites} toggleFavorite={toggleFavorite}
              refreshAll={refreshAll}
              screen={screen} setScreen={setScreen} tab={tab} setTab={setTab}
              subTab={subTab} setSubTab={setSubTab}
              breedTab={breedTab} setBreedTab={setBreedTab}
              drawer={drawer} setDrawer={setDrawer} selected={selected} setSelected={setSelected}
            />
          )}
        </div>
      )}
    </div>
  );
}

// ---------- APP SHELL (giriş yapılmış kullanıcı) ----------
function AppShell({ me, setMe, listings, requests, offers, reviews, messages, members, favorites, toggleFavorite, refreshAll, screen, setScreen, tab, setTab, subTab, setSubTab, breedTab, setBreedTab, drawer, setDrawer, selected, setSelected }) {
  const [expandedSub, setExpandedSub] = useState(null);
  const [seedState, setSeedState] = useState({ loading: false, error: null, fallback: false });
  const [chatTarget, setChatTarget] = useState(null); // { conversationId, otherName, listingLabel }
  const [chatRegion, setChatRegion] = useState(null);
  const runSeed = async () => {
    setSeedState({ loading: true, error: null, fallback: false });
    const result = await seedSampleListings(refreshAll);
    setSeedState({ loading: false, error: result.ok ? null : result.error, fallback: !!result.fallback });
  };
  const filtered = listings
    .filter(l => l.mainCategory === tab)
    .filter(l => subTab === "tumu" || l.subCategory === subTab)
    .filter(l => breedTab === "tumu" || l.breed === breedTab)
    .filter(l => l.status !== "kaldirildi");
  const open = (item) => { setSelected(item); setScreen("detail"); };
  const openChat = (conversationId, otherName, listingLabel) => { setChatTarget({ conversationId, otherName, listingLabel }); setScreen("chat"); };

  const myIncomingOffers = offers.filter(o => o.sellerName === me.name);
  const myConversationIds = Array.from(new Set(
    messages.map(m => m.conversationId).filter(cid => {
      const p = convParts(cid);
      return p.buyerName === me.name || p.sellerName === me.name;
    })
  ));

  return (
    <>
      {screen !== "detail" && screen !== "chat" && screen !== "regionChat" && (
        <div style={{ background: COLORS.pine, padding: "14px 14px 10px", display: "flex", alignItems: "center", gap: 10 }}>
          <button onClick={() => setDrawer(true)} style={{ background: "none", border: "none", cursor: "pointer" }}><Menu color={COLORS.white} size={20} /></button>
          <Logo size={22} />
          <div style={{ flex: 1, background: "rgba(255,255,255,0.14)", borderRadius: 10, padding: "7px 10px", display: "flex", alignItems: "center", gap: 6 }}>
            <Search size={14} color="#D8E6DC" /><span style={{ color: "#D8E6DC", fontFamily: "Inter", fontSize: 12.5 }}>Irk, konum ara...</span>
          </div>
          <button onClick={() => setScreen("myoffers")} style={{ background: "none", border: "none", cursor: "pointer", position: "relative" }}>
            <Inbox color={COLORS.white} size={20} />
            {myIncomingOffers.some(o => o.status === "beklemede") && <span style={{ position: "absolute", top: -3, right: -3, width: 8, height: 8, borderRadius: "50%", background: COLORS.ochre }} />}
          </button>
        </div>
      )}

      {screen === "home" && (
        <>
          <button onClick={() => setScreen("requests")} style={{ margin: "10px 14px 4px", padding: "10px 12px", borderRadius: 14, background: COLORS.pineDeep, display: "flex", alignItems: "center", gap: 10, border: "none", cursor: "pointer", width: "calc(100% - 28px)" }}>
            <span style={{ position: "relative", width: 10, height: 10, flexShrink: 0 }}>
              <span style={{ position: "absolute", inset: 0, borderRadius: "50%", background: "#7CD9A0", animation: "pulseDot 1.8s ease-out infinite" }} />
              <span style={{ position: "absolute", inset: 2, borderRadius: "50%", background: "#7CD9A0" }} />
            </span>
            <div style={{ color: COLORS.white, fontFamily: "Inter", fontSize: 12.5 }}>
              <b style={{ fontFamily: "IBM Plex Mono" }}>{requests.filter(r => r.status !== "kapandi").length}</b> açık alım talebi var
            </div>
          </button>

          {(tab !== "buyukbas" || subTab !== "tumu" || breedTab !== "tumu") && (
            <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "8px 14px 0", flexWrap: "wrap" }}>
              <span style={{ fontFamily: "Inter", fontSize: 10.5, color: "#8A8776" }}>Filtre:</span>
              <Badge tone="pine">{tab === "buyukbas" ? "Büyükbaş" : "Küçükbaş"}</Badge>
              {subTab !== "tumu" && <Badge tone="ochre">{subTab}</Badge>}
              {breedTab !== "tumu" && <Badge tone="gray">{breedTab}</Badge>}
              <button onClick={() => setDrawer(true)} style={{ fontFamily: "Inter", fontSize: 10.5, color: COLORS.pineDeep, background: "none", border: "none", textDecoration: "underline", cursor: "pointer" }}>değiştir</button>
            </div>
          )}

          <div style={{ flex: 1, overflowY: "auto", padding: "10px 14px 90px" }}>
            {filtered.length === 0 ? (
              <div style={{ textAlign: "center", marginTop: 40, color: "#8A8776", fontFamily: "Inter", fontSize: 12.5 }}>
                Henüz ilan yok.
                <div style={{ marginTop: 10 }}>
                  <button onClick={runSeed} disabled={seedState.loading} style={{ ...btnGhost, borderColor: COLORS.pine, color: COLORS.pineDeep, margin: "0 auto" }}>
                    {seedState.loading ? "Yükleniyor..." : "Önizleme için örnek ilanlar yükle"}
                  </button>
                  {seedState.error && (
                    <div style={{ color: COLORS.red, fontSize: 10.5, marginTop: 6, maxWidth: 260, marginLeft: "auto", marginRight: "auto" }}>
                      Hata: {seedState.error}
                    </div>
                  )}
                  {seedState.fallback && (
                    <div style={{ color: COLORS.ochre, fontSize: 10.5, marginTop: 6, maxWidth: 260, marginLeft: "auto", marginRight: "auto" }}>
                      Not: kalıcı depolama şu an bu ortamda çalışmıyor, veriler bu oturum için geçici olarak tutuluyor (sayfa tamamen yenilenirse silinir).
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {filtered.map(item => <ListingCard key={item.id} item={item} reviews={reviews} favorites={favorites} toggleFavorite={toggleFavorite} onOpen={open} />)}
              </div>
            )}
          </div>
        </>
      )}

      {screen === "detail" && selected && (
        <DetailScreen item={listings.find(l => l.id === selected.id) || selected} me={me} offers={offers} reviews={reviews} favorites={favorites} toggleFavorite={toggleFavorite} onOpenChat={openChat} refreshAll={refreshAll} onBack={() => setScreen("home")} />
      )}

      {screen === "create" && <CreateScreen me={me} members={members} refreshAll={refreshAll} onDone={() => setScreen("home")} />}

      {screen === "requests" && (
        <div style={{ flex: 1, overflowY: "auto", padding: "16px 18px 100px" }}>
          <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 19, marginBottom: 12 }}>Alım Talepleri</div>
          {requests.length === 0 && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#8A8776" }}>Henüz talep yok.</div>}
          {requests.slice().reverse().map(r => (
            <div key={r.id} style={{ background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 12, marginBottom: 10 }}>
              <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13.5 }}>{TL(r.budget)} bütçe ile {r.category} arıyorum</div>
              <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "#7A7768", margin: "4px 0" }}>{r.breed ? `Tercih: ${r.breed}` : "Irk fark etmez"}</div>
              <div style={{ fontFamily: "Inter", fontSize: 10.5, color: "#8A8776" }}>{r.buyerName}</div>
            </div>
          ))}

      )}

      {screen === "myoffers" && (
        <div style={{ flex: 1, overflowY: "auto", padding: "16px 18px 100px" }}>
          <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 19, marginBottom: 12 }}>İlanlarıma Gelen Teklifler</div>
          {myIncomingOffers.length === 0 && <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#8A8776" }}>Henüz teklif yok.</div>}
          {myIncomingOffers.slice().reverse().map(o => (
            <IncomingOfferRow key={o.id} offer={o} refreshAll={refreshAll} />

      )}

      {screen === "favorites" && (
        <div style={{ flex: 1, overflowY: "auto", padding: "16px 18px 100px" }}>
          <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 19, marginBottom: 12 }}>Favorilerim</div>
          {listings.filter(l => favorites.includes(l.id)).length === 0 ? (
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#8A8776" }}>Henüz favori ilanınız yok — bir ilan kartındaki kalp ikonuna dokunun.</div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              {listings.filter(l => favorites.includes(l.id)).map(item => (
                <ListingCard key={item.id} item={item} reviews={reviews} favorites={favorites} toggleFavorite={toggleFavorite} onOpen={open} />
              ))}
            </div>
          )}
        </div>
      )}

      {screen === "chatHub" && (
        <ChatHub me={me} messages={messages} listings={listings} region={me.region} onOpenChat={openChat} onOpenRegion={(r) => { setChatRegion(r); setScreen("regionChat"); }} myConversationIds={myConversationIds} />
      )}

      {screen === "chat" && chatTarget && (
        <ChatScreen key={chatTarget.conversationId} title={chatTarget.otherName} subtitle={chatTarget.listingLabel} conversationId={chatTarget.conversationId} me={me} messages={messages.filter(m => m.conversationId === chatTarget.conversationId)} refreshAll={refreshAll} onBack={() => setScreen("chatHub")} />
      )}

      {screen === "regionChat" && chatRegion && (
        <ChatScreen key={chatRegion} title={chatRegion} subtitle="Bölge Sohbeti — herkese açık" conversationId={regionChatKey(chatRegion)} me={me} messages={messages.filter(m => m.conversationId === regionChatKey(chatRegion))} refreshAll={refreshAll} onBack={() => setScreen("chatHub")} isGroup />
      )}

      {screen === "profile" && <ProfileScreen me={me} setMe={setMe} listings={listings} members={members} favorites={favorites} setScreen={setScreen} refreshAll={refreshAll} />}

      {drawer && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(20,48,31,0.4)", zIndex: 10 }} onClick={() => setDrawer(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: 280, height: "100%", background: COLORS.white, padding: 18, overflowY: "auto" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
              <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 17, color: COLORS.pineDeep }}>Kategoriler</div>
              <button onClick={() => setDrawer(false)} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={18} color="#8A8776" /></button>
            </div>

            {[["buyukbas", "Büyükbaş"], ["kucukbas", "Küçükbaş"]].map(([mainKey, mainLabel]) => (
              <div key={mainKey} style={{ marginBottom: 14 }}>
                <button
                  onClick={() => { setTab(mainKey); setSubTab("tumu"); setBreedTab("tumu"); setScreen("home"); setDrawer(false); }}
                  style={{
                    width: "100%", textAlign: "left", padding: "9px 10px", borderRadius: 8, border: "none", cursor: "pointer",
                    fontFamily: "Fraunces", fontWeight: 700, fontSize: 14.5, marginBottom: 3,
                    background: tab === mainKey && subTab === "tumu" ? COLORS.pineDeep : COLORS.paper,
                    color: tab === mainKey && subTab === "tumu" ? COLORS.white : COLORS.pineDeep,
                  }}
                >{mainLabel}</button>
                <div style={{ display: "flex", flexDirection: "column" }}>
                  {ALT_KATEGORI[mainKey].map(sub => {
                    const isOpen = expandedSub === sub;
                    const isActiveSub = tab === mainKey && subTab === sub && breedTab === "tumu";
                    return (
                      <div key={sub}>
                        <div style={{ display: "flex", alignItems: "center" }}>
                          <button
                            onClick={() => { setTab(mainKey); setSubTab(sub); setBreedTab("tumu"); setScreen("home"); setDrawer(false); }}
                            style={{
                              flex: 1, textAlign: "left", padding: "8px 6px 8px 20px", border: "none", cursor: "pointer",
                              fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, borderRadius: 6,
                              background: isActiveSub ? COLORS.ochreSoft : "transparent",
                              color: isActiveSub ? "#7A5A1E" : "#5A574C",
                            }}
                          >{sub}</button>
                          <button
                            onClick={() => setExpandedSub(isOpen ? null : sub)}
                            style={{ background: "none", border: "none", cursor: "pointer", padding: "6px 8px", color: "#B7B4A6" }}
                          >
                            <ChevronRight size={14} style={{ transform: isOpen ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
                          </button>
                        </div>
                        {isOpen && (
                          <div style={{ display: "flex", flexDirection: "column", marginBottom: 4 }}>
                            {IRKLAR[sub].map(breed => (
                              <button
                                key={breed}
                                onClick={() => { setTab(mainKey); setSubTab(sub); setBreedTab(breed); setScreen("home"); setDrawer(false); }}

                                  fontFamily: "Inter", fontWeight: 500, fontSize: 11.5, borderRadius: 6,
                                  background: tab === mainKey && subTab === sub && breedTab === breed ? COLORS.pine : "transparent",
                                  color: tab === mainKey && subTab === sub && breedTab === breed ? COLORS.white : "#8A8776",

                            ))}

                </div>
              </div>

          </div>
        </div>

      {screen !== "detail" && screen !== "chat" && screen !== "regionChat" && (
        <div style={{ display: "flex", borderTop: `1px solid ${COLORS.line}`, background: COLORS.white, padding: "10px 0 14px" }}>
          {[["home", Home, "Ana Sayfa"], ["create", PlusCircle, "İlan Ver"], ["chatHub", MessageCircle, "Sohbet"], ["profile", User, "Profil"]].map(([s, Icon, l]) => {
            const active = s === "chatHub" ? ["chatHub", "chat", "regionChat"].includes(screen) : screen === s;

              <button key={s} onClick={() => setScreen(s)} style={{ flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 2, cursor: "pointer" }}>

                <span style={{ fontFamily: "Inter", fontSize: 9.5, color: active ? COLORS.pineDeep : "#B7B4A6", fontWeight: 600 }}>{l}</span>
              </button>

          })}

    </>
  );
}

// ---------- DETAIL + TEKLİF ----------
function DetailScreen({ item, me, offers, reviews, favorites, toggleFavorite, onOpenChat, refreshAll, onBack }) {
  const isOwner = item.sellerName === me.name;
  const myOffer = offers.find(o => o.listingId === item.id && o.buyerName === me.name);
  const listingOffers = offers.filter(o => o.listingId === item.id);
  const [amount, setAmount] = useState(Math.round(item.price * 0.9));
  const [showForm, setShowForm] = useState(false);
  const [saving, setSaving] = useState(false);
  const rating = sellerRating(reviews, item.sellerName);
  const myReview = reviews.find(r => r.listingId === item.id && r.buyerName === me.name);
  const dealDone = myOffer && myOffer.status === "kabul";
  const isFav = favorites.includes(item.id);

  const sendOffer = async () => {
    setSaving(true);
    const all = await loadShared("offers", []);
    all.push({ id: uid(), listingId: item.id, buyerName: me.name, sellerName: item.sellerName, amount, status: "beklemede", createdAt: Date.now() });
    await saveShared("offers", all);
    await refreshAll();
    setSaving(false); setShowForm(false);
  };

  const infoRows = [
    ["Yaş", item.age], ["Cinsiyet", item.gender], ["Irk", item.breed],
    item.weight ? ["Ağırlık", `${item.weight} kg`] : null,
    item.purpose ? ["Amaç", item.purpose] : null,
    item.vaccinated ? ["Aşı Durumu", item.vaccinated] : null,
    item.gender === "Dişi" && item.isPregnant ? ["Gebelik", item.isPregnant] : null,
    item.gender === "Dişi" && item.dailyMilkLiters ? ["Süt Verimi", `${item.dailyMilkLiters} L/gün`] : null,
  ].filter(Boolean);

  return (
    <div style={{ flex: 1, overflowY: "auto", paddingBottom: 20 }}>
      <div style={{ background: "#DFF0E4", height: 190, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 84, position: "relative" }}>
        <button onClick={onBack} style={{ position: "absolute", top: 14, left: 14, background: "rgba(255,255,255,0.85)", border: "none", borderRadius: "50%", width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}><ChevronLeft size={18} /></button>
        <span>{EMOJI[item.subCategory] || "🐾"}</span>
      </div>
      <div style={{ padding: "16px 18px" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 20, color: COLORS.ink }}>{item.breed} {item.subCategory}</div>
            <div style={{ fontFamily: "Inter", fontSize: 12, color: "#7A7768", margin: "3px 0 10px" }}>{item.age} · {item.gender}</div>
          </div>
          <button onClick={() => toggleFavorite(item.id)} style={{ background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: "50%", width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}>
            <Heart size={16} fill={isFav ? COLORS.red : "none"} color={isFav ? COLORS.red : COLORS.pineDeep} />
          </button>
        </div>
        <div style={{ fontFamily: "IBM Plex Mono", fontWeight: 700, fontSize: 24, color: COLORS.pineDeep, marginBottom: 12 }}>{TL(item.price)}</div>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
          {infoRows.map(([k, v]) => (
            <div key={k} style={{ background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "8px 10px" }}>
              <div style={{ fontFamily: "Inter", fontSize: 10.5, color: "#8A8776" }}>{k}</div>
              <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, color: COLORS.ink }}>{v}</div>
            </div>
          ))}
        </div>

        {item.description && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12, color: "#5A574C", marginBottom: 4 }}>Açıklama</div>
            <div style={{ fontFamily: "Inter", fontSize: 12.5, color: COLORS.ink, lineHeight: 1.5, background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: "10px 12px" }}>{item.description}</div>
          </div>
        )}

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 16, padding: "10px 12px", background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 12 }}>
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: COLORS.ochreSoft, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Fraunces", fontWeight: 600, color: "#7A5A1E" }}>{item.sellerName[0]}</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13 }}>{item.sellerName}</div>
            <div style={{ fontFamily: "Inter", fontSize: 10.5, color: "#8A8776", display: "flex", alignItems: "center", gap: 5 }}><ShieldCheck size={11} color={COLORS.pineDeep} /> Telefon doğrulandı (simülasyon)</div>
            <div style={{ display: "flex", alignItems: "center", gap: 5, marginTop: 3 }}>
              {rating.count > 0 ? (
                <>
                  <StarRow value={rating.avg} size={11} />
                  <span style={{ fontFamily: "IBM Plex Mono", fontSize: 10.5, color: "#5A574C" }}>{rating.avg} ({rating.count})</span>
                </>
              ) : (
                <span style={{ fontFamily: "Inter", fontSize: 10.5, color: "#B7B4A6" }}>Henüz değerlendirme yok</span>
              )}
            </div>
          </div>
        </div>

        {isOwner ? (
          <div>
            <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13, marginBottom: 8 }}>Bu ilana gelen teklifler ({listingOffers.length})</div>
            {listingOffers.length === 0 && <div style={{ fontFamily: "Inter", fontSize: 12, color: "#8A8776" }}>Henüz teklif yok.</div>}
            {listingOffers.map(o => (
              <div key={o.id}>
                <IncomingOfferRow offer={o} refreshAll={refreshAll} />
                <button onClick={() => onOpenChat(convId(item.id, o.buyerName, item.sellerName), o.buyerName, `${item.breed} ${item.subCategory}`)} style={{ ...btnGhost, borderColor: COLORS.line, color: COLORS.pineDeep, marginTop: -4, marginBottom: 8 }}>
                  <MessageCircle size={12} style={{ marginRight: 4 }} />{o.buyerName} ile mesajlaş
                </button>
              </div>
            ))}
          </div>
        ) : myOffer ? (
          <>
            <OfferStatusView offer={myOffer} refreshAll={refreshAll} />
            <button onClick={() => onOpenChat(convId(item.id, me.name, item.sellerName), item.sellerName, `${item.breed} ${item.subCategory}`)} style={{ ...btnGhost, width: "100%", justifyContent: "center", marginTop: 8, borderColor: COLORS.line, color: COLORS.pineDeep }}>
              <MessageCircle size={13} style={{ marginRight: 5 }} />{item.sellerName} ile mesajlaş
            </button>
            {dealDone && (
              <div style={{ marginTop: 10 }}>
                {myReview ? (
                  <div style={{ background: COLORS.paper, borderRadius: 12, padding: 12, fontFamily: "Inter", fontSize: 12 }}>
                    Değerlendirmeniz: <StarRow value={myReview.stars} size={13} />
                    {myReview.comment && <div style={{ color: "#5A574C", marginTop: 4 }}>{myReview.comment}</div>}
                  </div>
                ) : (
                  <ReviewForm listingId={item.id} sellerName={item.sellerName} buyerName={me.name} refreshAll={refreshAll} />
                )}
              </div>
            )}
          </>
        ) : showForm ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <label style={{ fontFamily: "Inter", fontSize: 12, color: "#5A574C" }}>Teklifiniz</label>
            <input type="number" value={amount} onChange={(e) => setAmount(+e.target.value)} style={{ fontFamily: "IBM Plex Mono", fontSize: 16, padding: "10px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, outline: "none" }} />
            <button onClick={sendOffer} disabled={saving} style={btnPrimary}>{saving ? "Gönderiliyor..." : "Teklifi Gönder"}</button>
          </div>
        ) : (
          <>
            <button onClick={() => setShowForm(true)} style={btnPrimary}>Teklif Yap</button>
            <button onClick={() => onOpenChat(convId(item.id, me.name, item.sellerName), item.sellerName, `${item.breed} ${item.subCategory}`)} style={{ ...btnGhost, width: "100%", justifyContent: "center", marginTop: 8, borderColor: COLORS.line, color: COLORS.pineDeep }}>
              <MessageCircle size={13} style={{ marginRight: 5 }} />{item.sellerName} ile mesajlaş
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function ReviewForm({ listingId, sellerName, buyerName, refreshAll }) {
  const [stars, setStars] = useState(5);
  const [comment, setComment] = useState("");
  const [saving, setSaving] = useState(false);

  const submit = async () => {
    setSaving(true);
    const all = await loadShared("reviews", []);
    all.push({ id: uid(), listingId, sellerName, buyerName, stars, comment: comment.trim(), createdAt: Date.now() });
    await saveShared("reviews", all);
    await refreshAll();
    setSaving(false);
  };

  return (
    <div style={{ background: COLORS.paper, borderRadius: 12, padding: 12 }}>
      <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, marginBottom: 8 }}>Satıcıyı değerlendir</div>
      <StarPicker value={stars} onChange={setStars} />
      <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Yorumunuz (opsiyonel)" rows={2} style={{ ...inputStyle, marginTop: 8, resize: "vertical", fontFamily: "Inter" }} />
      <button onClick={submit} disabled={saving} style={{ ...btnPrimary, marginTop: 8 }}>{saving ? "Gönderiliyor..." : "Değerlendirmeyi Gönder"}</button>
    </div>
  );
}

function OfferStatusView({ offer, refreshAll }) {
  const map = {
    beklemede: { text: "Teklifiniz satıcıya iletildi, yanıt bekleniyor.", color: COLORS.ochre, bg: COLORS.ochreSoft },
    kabul: { text: "Teklifiniz kabul edildi!", color: COLORS.pineDeep, bg: "#DCEAE0" },
    red: { text: "Teklifiniz reddedildi.", color: COLORS.red, bg: "#F6E2DC" },
    karsi_teklif: { text: `Satıcı karşı teklif verdi: ${TL(offer.counterAmount)}`, color: "#7A5A1E", bg: COLORS.ochreSoft },
  };
  const s = map[offer.status];
  const respond = async (accept) => {
    const all = await loadShared("offers", []);
    const idx = all.findIndex(o => o.id === offer.id);
    if (idx > -1) { all[idx].status = accept ? "kabul" : "red"; await saveShared("offers", all); await refreshAll(); }
  };
  return (
    <div style={{ background: s.bg, borderRadius: 12, padding: 12, fontFamily: "Inter", fontSize: 12.5, color: s.color, fontWeight: 600 }}>
      {s.text}
      <div style={{ fontWeight: 400, fontFamily: "IBM Plex Mono", marginTop: 4 }}>Teklifiniz: {TL(offer.amount)}</div>
      {offer.status === "karsi_teklif" && (
        <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
          <button onClick={() => respond(true)} style={{ ...btnGhost, borderColor: COLORS.pine, color: COLORS.pineDeep }}>Kabul Et</button>
          <button onClick={() => respond(false)} style={{ ...btnGhost, borderColor: COLORS.red, color: COLORS.red }}>Reddet</button>
        </div>
      )}
    </div>
  );
}

function IncomingOfferRow({ offer, refreshAll }) {
  const [counterMode, setCounterMode] = useState(false);
  const [counter, setCounter] = useState(Math.round(offer.amount * 1.05));

  const update = async (patch) => {
    const all = await loadShared("offers", []);
    const idx = all.findIndex(o => o.id === offer.id);
    if (idx > -1) { all[idx] = { ...all[idx], ...patch }; await saveShared("offers", all); await refreshAll(); }
  };

  return (
    <div style={{ background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 11, marginBottom: 8 }}>
      <div style={{ fontFamily: "Inter", fontSize: 12.5, fontWeight: 600 }}>{offer.buyerName}</div>
      <div style={{ fontFamily: "IBM Plex Mono", fontSize: 15, color: COLORS.pineDeep, margin: "3px 0 6px" }}>{TL(offer.amount)}</div>
      {offer.status === "beklemede" && !counterMode && (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          <button onClick={() => update({ status: "kabul" })} style={{ ...btnGhost, borderColor: COLORS.pine, color: COLORS.pineDeep }}><Check size={12} style={{ marginRight: 3 }} />Kabul Et</button>
          <button onClick={() => update({ status: "red" })} style={{ ...btnGhost, borderColor: COLORS.red, color: COLORS.red }}><X size={12} style={{ marginRight: 3 }} />Reddet</button>
          <button onClick={() => setCounterMode(true)} style={{ ...btnGhost, borderColor: COLORS.ochre, color: "#7A5A1E" }}><Repeat size={12} style={{ marginRight: 3 }} />Karşı Teklif</button>
        </div>
      )}
      {counterMode && (
        <div style={{ display: "flex", gap: 6 }}>
          <input type="number" value={counter} onChange={(e) => setCounter(+e.target.value)} style={{ fontFamily: "IBM Plex Mono", fontSize: 13, padding: "6px 8px", borderRadius: 8, border: `1px solid ${COLORS.line}`, width: 100 }} />
          <button onClick={() => update({ status: "karsi_teklif", counterAmount: counter })} style={{ ...btnGhost, borderColor: COLORS.pine, color: COLORS.pineDeep }}>Gönder</button>
        </div>
      )}
      {["kabul", "red", "karsi_teklif"].includes(offer.status) && !counterMode && (
        <Badge tone={offer.status === "kabul" ? "pine" : offer.status === "red" ? "gray" : "ochre"}>
          {offer.status === "kabul" ? "Kabul edildi" : offer.status === "red" ? "Reddedildi" : `Karşı teklif: ${TL(offer.counterAmount)}`}
        </Badge>
      )}
    </div>
  );
}

// ---------- CREATE ----------
function CreateScreen({ me, members, refreshAll, onDone }) {
  useEffect(() => { refreshAll(); }, []);
  const isBuyerOnly = me.profileType === "alici";
  const myMember = members.find(m => m.name === me.name && m.joinedAt === me.joinedAt);
  const documentStatus = myMember ? myMember.documentStatus : me.documentStatus;
  const isApprovedSeller = isBuyerOnly || documentStatus === "onaylandi";
  const [createType, setCreateType] = useState(isBuyerOnly || !isApprovedSeller ? "talep" : "ilan");
  const [mainCategory, setMainCategory] = useState("buyukbas");
  const [subCategory, setSubCategory] = useState("Düve");
  const [breed, setBreed] = useState("");
  const [age, setAge] = useState("");
  const [gender, setGender] = useState("Dişi");
  const [price, setPrice] = useState("");
  const [weight, setWeight] = useState("");
  const [purpose, setPurpose] = useState("Damızlık");
  const [vaccinated, setVaccinated] = useState("Aşılı");
  const [isPregnant, setIsPregnant] = useState("Değil");
  const [dailyMilkLiters, setDailyMilkLiters] = useState("");
  const [description, setDescription] = useState("");
  const [budget, setBudget] = useState("");
  const [prefBreed, setPrefBreed] = useState("");
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");

  const submitListing = async () => {
    if (!isApprovedSeller) { setErr("Belgeniz onaylanmadan ilan veremezsiniz."); return; }
    if (!breed || !age || !price) { setErr("Tüm alanları doldurun."); return; }
    setSaving(true);
    const all = await loadShared("listings", []);
    all.push({
      id: uid(), mainCategory, subCategory, breed, age, gender, price: Number(price),
      weight: weight ? Number(weight) : null,
      purpose, vaccinated,
      isPregnant: gender === "Dişi" ? isPregnant : null,
      dailyMilkLiters: gender === "Dişi" && dailyMilkLiters ? Number(dailyMilkLiters) : null,
      description: description.trim(),
      sellerName: me.name, profileType: me.profileType, status: "yayinda", createdAt: Date.now(),
    });
    await saveShared("listings", all);
    await refreshAll(); setSaving(false); onDone();
  };
  const submitRequest = async () => {
    if (!budget) { setErr("Bütçe girin."); return; }
    setSaving(true);
    const all = await loadShared("requests", []);
    all.push({ id: uid(), budget: Number(budget), category: subCategory, breed: prefBreed, buyerName: me.name, status: "acik", createdAt: Date.now() });
    await saveShared("requests", all);
    await refreshAll(); setSaving(false); onDone();
  };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px 18px 100px" }}>
      <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 19, marginBottom: 12 }}>Yeni Oluştur</div>
      {isBuyerOnly ? (
        <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "#8A8776", background: COLORS.paper, borderRadius: 10, padding: "9px 12px", marginBottom: 14 }}>
          Sadece alıcı hesabıyla satılık ilan veremezsiniz — yalnızca "Hayvan Arıyorum" talebi açabilirsiniz.

      ) : !isApprovedSeller ? (
        <div style={{ fontFamily: "Inter", fontSize: 11.5, color: documentStatus === "reddedildi" ? COLORS.red : "#7A5A1E", background: documentStatus === "reddedildi" ? "#F6E2DC" : COLORS.ochreSoft, borderRadius: 10, padding: "9px 12px", marginBottom: 14 }}>
          {documentStatus === "reddedildi"
            ? "Belgeniz reddedildi, bu nedenle satılık ilan veremezsiniz. Yalnızca \"Hayvan Arıyorum\" talebi açabilirsiniz."
            : "Belgeniz onay bekliyor — onaylanana kadar satılık ilan veremezsiniz. Yalnızca \"Hayvan Arıyorum\" talebi açabilirsiniz."}

          <button onClick={() => setCreateType("talep")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, background: createType === "talep" ? COLORS.pineDeep : COLORS.white, color: createType === "talep" ? COLORS.white : "#5A574C" }}>"Hayvan Arıyorum"</button>
        </div>
      )}

      <div style={{ marginBottom: 10 }}>
        <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Ana Kategori</label>
        <div style={{ display: "flex", gap: 6, marginTop: 4 }}>
          {["buyukbas", "kucukbas"].map(k => (
            <button key={k} onClick={() => { setMainCategory(k); setSubCategory(ALT_KATEGORI[k][0]); }} style={{ flex: 1, padding: "8px", borderRadius: 8, border: `1px solid ${COLORS.line}`, cursor: "pointer", fontFamily: "Inter", fontWeight: 600, fontSize: 11.5, background: mainCategory === k ? COLORS.pineDeep : COLORS.white, color: mainCategory === k ? COLORS.white : "#5A574C" }}>{k === "buyukbas" ? "Büyükbaş" : "Küçükbaş"}</button>
          ))}
        </div>
      </div>
      <div style={{ marginBottom: 10 }}>
        <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Alt Kategori</label>
        <select value={subCategory} onChange={(e) => setSubCategory(e.target.value)} style={{ ...inputStyle, marginTop: 4 }}>
          {ALT_KATEGORI[mainCategory].map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>

      {createType === "ilan" ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <FormField label="Irk" value={breed} onChange={setBreed} placeholder="Örn. Simental" />
          <FormField label="Yaş" value={age} onChange={setAge} placeholder="Örn. 18 Ay" />
          <div>
            <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Cinsiyet</label>
            <select value={gender} onChange={(e) => setGender(e.target.value)} style={{ ...inputStyle, marginTop: 4 }}>
              <option>Dişi</option><option>Erkek</option>
            </select>
          </div>
          <FormField label="Ağırlık (kg, opsiyonel)" value={weight} onChange={setWeight} placeholder="Örn. 380" type="number" />
          <div>
            <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Amaç</label>
            <select value={purpose} onChange={(e) => setPurpose(e.target.value)} style={{ ...inputStyle, marginTop: 4 }}>
              <option>Damızlık</option><option>Süt</option><option>Besi</option><option>Kesimlik</option>
            </select>
          </div>
          <div>
            <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Aşı Durumu</label>
            <select value={vaccinated} onChange={(e) => setVaccinated(e.target.value)} style={{ ...inputStyle, marginTop: 4 }}>

            <>

                  <option>Değil</option><option>Gebe</option>
                </select>
              </div>
              <FormField label="Günlük Süt Verimi (L, opsiyonel)" value={dailyMilkLiters} onChange={setDailyMilkLiters} placeholder="Örn. 25" type="number" />
            </>

          <div>
            <label style={{ fontFamily: "Inter", fontSize: 11.5, color: "#5A574C", fontWeight: 600 }}>Açıklama (opsiyonel)</label>

          <FormField label="Fiyat (TL)" value={price} onChange={setPrice} placeholder="Örn. 92000" type="number" />

const PROFILE_TYPE_LABELS = { ciftlik: "Çiftlik / Ticari", bireysel: "Bireysel Yetiştirici", alici: "Sadece Alıcı" };

// ---------- SOHBET MERKEZİ ----------
function ChatHub({ me, messages, listings, region, onOpenChat, onOpenRegion, myConversationIds }) {
  const [tab, setTab] = useState("mesajlar");

  const threads = myConversationIds.map(cid => {
    const parts = convParts(cid);
    const otherName = parts.buyerName === me.name ? parts.sellerName : parts.buyerName;
    const listing = listings.find(l => l.id === parts.listingId);
    const listingLabel = listing ? `${listing.breed} ${listing.subCategory}` : "İlan";
    const msgs = messages.filter(m => m.conversationId === cid);
    const last = msgs.reduce((a, b) => (a.createdAt > b.createdAt ? a : b), msgs[0]);
    return { cid, otherName, listingLabel, last };
  }).sort((a, b) => b.last.createdAt - a.last.createdAt);

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px 18px 100px" }}>
      <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 19, marginBottom: 12 }}>Sohbet</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
        <button onClick={() => setTab("mesajlar")} style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "Inter", fontWeight: 600, fontSize: 12, background: tab === "mesajlar" ? COLORS.pineDeep : COLORS.white, color: tab === "mesajlar" ? COLORS.white : "#5A574C" }}>Mesajlarım</button>
        <button onClick={() => setTab("bolge")} style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", cursor: "pointer", fontFamily: "Inter", fontWeight: 600, fontSize: 12, background: tab === "bolge" ? COLORS.pineDeep : COLORS.white, color: tab === "bolge" ? COLORS.white : "#5A574C" }}>Bölge Sohbetleri</button>
      </div>

      {tab === "mesajlar" ? (
        threads.length === 0 ? (
          <div style={{ fontFamily: "Inter", fontSize: 12.5, color: "#8A8776" }}>Henüz mesajınız yok — bir ilan sayfasından "mesajlaş" diyerek başlayın.</div>
        ) : (
          threads.map(t => (
            <button key={t.cid} onClick={() => onOpenChat(t.cid, t.otherName, t.listingLabel)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", textAlign: "left" }}>
              <div style={{ width: 36, height: 36, borderRadius: "50%", background: COLORS.ochreSoft, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Fraunces", fontWeight: 600, color: "#7A5A1E", flexShrink: 0 }}>{t.otherName[0]}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13 }}>{t.otherName}</div>
                <div style={{ fontFamily: "Inter", fontSize: 11, color: "#8A8776" }}>{t.listingLabel}</div>
                <div style={{ fontFamily: "Inter", fontSize: 11, color: "#5A574C", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{t.last.sender === me.name ? "Siz: " : ""}{t.last.text}</div>
              </div>
            </button>
          ))
        )
      ) : (
        <div>
          <div style={{ fontFamily: "Inter", fontSize: 11, color: "#8A8776", marginBottom: 10 }}>
            Türkiye genelinde bölgenizdeki (veya herhangi bir bölgedeki) kullanıcılarla ortak, herkese açık sohbet alanları — WhatsApp grubu gibi düşünün.
          </div>
          {REGIONS.map(r => {
            const count = messages.filter(m => m.conversationId === regionChatKey(r)).length;
            const isMine = region === r;
            return (
              <button key={r} onClick={() => onOpenRegion(r)} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", background: isMine ? COLORS.ochreSoft : COLORS.white, border: `1px solid ${isMine ? COLORS.ochre : COLORS.line}`, borderRadius: 12, padding: 12, marginBottom: 8, cursor: "pointer", textAlign: "left" }}>
                <div style={{ width: 36, height: 36, borderRadius: "50%", background: COLORS.pineDeep, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                  <Globe2 size={16} color={COLORS.white} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 13 }}>{r}{isMine && <span style={{ color: COLORS.ochre }}> · Bölgeniz</span>}</div>
                  <div style={{ fontFamily: "Inter", fontSize: 11, color: "#8A8776" }}>{count} mesaj</div>
                </div>
                <ChevronRight size={14} color="#B7B4A6" />
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---------- SOHBET EKRANI (özel veya bölge — ikisi de aynı yapıyı kullanır) ----------
function ChatScreen({ title, subtitle, conversationId, me, messages, refreshAll, onBack, isGroup }) {
  const [text, setText] = useState("");
  const [sending, setSending] = useState(false);

  useEffect(() => {
    const interval = setInterval(() => { refreshAll(); }, 3000); // "canlı" his için kısa aralıklı yenileme
    return () => clearInterval(interval);
  }, [refreshAll]);

  const send = async () => {
    if (!text.trim()) return;
    setSending(true);
    const all = await loadShared("messages", []);
    all.push({ id: uid(), conversationId, sender: me.name, text: text.trim(), createdAt: Date.now() });
    await saveShared("messages", all);
    setText("");
    await refreshAll();
    setSending(false);
  };

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column" }}>
      <div style={{ background: COLORS.pine, padding: "14px 14px 10px", display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={onBack} style={{ background: "none", border: "none", cursor: "pointer" }}><ChevronLeft color={COLORS.white} size={20} /></button>
        <div style={{ width: 30, height: 30, borderRadius: "50%", background: isGroup ? COLORS.pineDeep : COLORS.ochreSoft, border: isGroup ? `1px solid rgba(255,255,255,0.3)` : "none", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          {isGroup ? <Globe2 size={14} color={COLORS.white} /> : <span style={{ fontFamily: "Fraunces", fontWeight: 600, color: "#7A5A1E", fontSize: 13 }}>{title[0]}</span>}
        </div>
        <div>
          <div style={{ color: COLORS.white, fontFamily: "Inter", fontWeight: 600, fontSize: 13.5 }}>{title}</div>
          <div style={{ color: "#D8E6DC", fontFamily: "Inter", fontSize: 10.5 }}>{subtitle}</div>
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", padding: "12px 14px", display: "flex", flexDirection: "column", gap: 8 }}>
        {messages.length === 0 && (
          <div style={{ textAlign: "center", marginTop: 30, fontFamily: "Inter", fontSize: 12, color: "#8A8776" }}>
            {isGroup ? "Bu bölgede henüz mesaj yok. İlk mesajı siz yazın." : "Henüz mesaj yok. Bir merhaba deyin!"}
          </div>
        )}
        {messages.slice().sort((a, b) => a.createdAt - b.createdAt).map(m => {
          const mine = m.sender === me.name;
          return (
            <div key={m.id} style={{ display: "flex", flexDirection: "column", alignItems: mine ? "flex-end" : "flex-start" }}>
              {isGroup && !mine && <span style={{ fontFamily: "Inter", fontSize: 9.5, color: "#8A8776", marginBottom: 2, marginLeft: 4 }}>{m.sender}</span>}
              <div style={{ maxWidth: "78%", background: mine ? COLORS.pineDeep : COLORS.white, color: mine ? COLORS.white : COLORS.ink, border: mine ? "none" : `1px solid ${COLORS.line}`, borderRadius: 14, padding: "8px 12px", fontFamily: "Inter", fontSize: 12.5, lineHeight: 1.4 }}>
                {m.text}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 8, padding: "10px 14px 16px", borderTop: `1px solid ${COLORS.line}`, background: COLORS.white }}>
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); }}
          placeholder="Mesaj yazın..."
          style={{ flex: 1, fontFamily: "Inter", fontSize: 13, padding: "10px 12px", borderRadius: 20, border: `1px solid ${COLORS.line}`, outline: "none" }}
        />
        <button onClick={send} disabled={sending || !text.trim()} style={{ width: 40, height: 40, borderRadius: "50%", background: COLORS.pineDeep, border: "none", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, opacity: sending || !text.trim() ? 0.5 : 1 }}>
          <Send size={16} color={COLORS.white} />
        </button>
      </div>
    </div>
  );
}

// ---------- PROFILE ----------
function ProfileScreen({ me, setMe, listings, members, favorites, setScreen, refreshAll }) {
  const [paying, setPaying] = useState(false);
  const [savingRegion, setSavingRegion] = useState(false);
  const myListings = listings.filter(l => l.sellerName === me.name);
  const myMember = members.find(m => m.name === me.name && m.joinedAt === me.joinedAt);
  const documentStatus = myMember ? myMember.documentStatus : me.documentStatus;

  const subscribe = async () => {
    setPaying(true);
    await new Promise(r => setTimeout(r, 900)); // ödeme simülasyonu
    const updatedMe = { ...me, subscribed: true };
    await savePersonal("me", updatedMe);
    const membersAll = await loadShared("members", []);
    const idx = membersAll.findIndex(m => m.name === me.name && m.joinedAt === me.joinedAt);
    if (idx > -1) { membersAll[idx].subscribed = true; await saveShared("members", membersAll); }
    setMe(updatedMe);
    await refreshAll();
    setPaying(false);
  };

  const setRegion = async (region) => {
    setSavingRegion(true);
    const updatedMe = { ...me, region };
    await savePersonal("me", updatedMe);
    setMe(updatedMe);
    setSavingRegion(false);
  };

  return (
    <div style={{ flex: 1, overflowY: "auto", padding: "16px 18px 100px" }}>
      <div style={{ fontFamily: "Fraunces", fontWeight: 700, fontSize: 19, marginBottom: 14 }}>Profilim</div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16 }}>
        <div style={{ width: 48, height: 48, borderRadius: "50%", background: COLORS.ochreSoft, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Fraunces", fontWeight: 600, color: "#7A5A1E", fontSize: 18 }}>{me.name[0]}</div>
        <div>
          <div style={{ fontFamily: "Inter", fontWeight: 600 }}>{me.name}</div>
          <div style={{ display: "flex", gap: 5, marginTop: 3, flexWrap: "wrap" }}>
            <Badge tone={me.profileType === "ciftlik" ? "pine" : me.profileType === "alici" ? "ochre" : "gray"}>{PROFILE_TYPE_LABELS[me.profileType] || me.profileType}</Badge>
            {documentStatus && (
              <Badge tone={documentStatus === "onaylandi" ? "pine" : documentStatus === "reddedildi" ? "gray" : "ochre"}>
                {documentStatus === "onaylandi" ? "Belge Onaylı" : documentStatus === "reddedildi" ? "Belge Reddedildi" : "Belge Onay Bekliyor"}
              </Badge>
            )}
          </div>
        </div>
      </div>

      <button onClick={() => setScreen("favorites")} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", background: COLORS.white, border: `1px solid ${COLORS.line}`, borderRadius: 12, padding: "11px 13px", marginBottom: 14, cursor: "pointer" }}>
        <Heart size={15} color={COLORS.red} />
        <span style={{ fontFamily: "Inter", fontWeight: 600, fontSize: 12.5, color: COLORS.ink }}>Favorilerim ({favorites.length})</span>
        <ChevronRight size={14} style={{ marginLeft: "auto" }} color="#B7B4A6" />
      </button>

      <div style={{ marginBottom: 14 }}>
        <div style={{ fontFamily: "Inter", fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>Bölgeniz</div>
        <select value={me.region || ""} onChange={(e) => setRegion(e.target.value)} disabled={savingRegion} style={inputStyle}>
          <option value="">Seçilmedi</option>
          {REGIONS.map(r => <option key={r} value={r}>{r}</option>)}
        </select>
        <div style={{ fontFamily: "Inter", fontSize: 10, color: "#8A8776", marginTop: 4 }}>Bölge sohbetlerinde varsayılan olarak bu bölge açılır.</div>
      </div>

      <div style={{ fontFamily: "Inter", fontSize: 12.5, fontWeight: 600, marginBottom: 6 }}>İlanlarım ({myListings.length})</div>
      {myListings.length === 0 && <div style={{ fontFamily: "Inter", fontSize: 11.5, color: "#8A8776", marginBottom: 12 }}>Henüz ilanınız yok.</div>}
      {myListings.map(l => (
        <div key={l.id} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${COLORS.line}`, fontFamily: "Inter", fontSize: 12.5 }}>
          <span>{l.breed} {l.subCategory}</span><span style={{ fontFamily: "IBM Plex Mono", color: COLORS.pineDeep }}>{TL(l.price)}</span>
        </div>
      ))}

      <div style={{ marginTop: 16, background: me.subscribed ? "#DCEAE0" : COLORS.pineDeep, borderRadius: 14, padding: 14 }}>
        {me.subscribed ? (
          <div style={{ color: COLORS.pineDeep, fontFamily: "Inter", fontWeight: 600, fontSize: 13 }}>✓ Aktif Abonelik — Sınırsız ilan hakkınız var</div>
        ) : (
          <>
            <div style={{ color: COLORS.white, fontFamily: "Fraunces", fontWeight: 600, fontSize: 14 }}>Aylık Abonelik — {TL(1000)}</div>
            <div style={{ color: "#CFE3D6", fontFamily: "Inter", fontSize: 11, margin: "4px 0 10px" }}>Sınırsız ilan hakkı ve öncelikli görünürlük</div>
            <div style={{ color: "#CFE3D6", fontFamily: "Inter", fontSize: 9.5, marginBottom: 8 }}>⚠ Ödeme simülasyonu — gerçek kart işlemi yapılmaz</div>
            <button onClick={subscribe} disabled={paying} style={{ background: COLORS.white, color: COLORS.pineDeep, border: "none", borderRadius: 8, padding: "8px 14px", fontFamily: "Inter", fontWeight: 600, fontSize: 12, cursor: "pointer" }}>{paying ? "İşleniyor..." : "Abone Ol (Simülasyon)"}</button>
          </>
        )}
      </div>
    </div>
  );
}
